name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=moderate

  windows:
    name: Windows installer and portable executable
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: DeveloperSecondBrain-windows
          # installer + portable .exe, and latest.yml/.blockmap for the installed app's auto-update
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS app (universal, unsigned)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
        env:
          # no Apple Developer certificate: the app is ad-hoc signed (see "identity" in package.json)
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: DeveloperSecondBrain-macos
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 30

  publish:
    # main: tags the commit with the version in package.json (moving the tag if that version was already
    # published) and replaces that release. A v* tag pushed by hand publishes that tag.
    name: Publish release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Work out the tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Tag this commit (moves the tag when the version already exists)
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f "${{ steps.version.outputs.tag }}"
          git push -f origin "refs/tags/${{ steps.version.outputs.tag }}"
      - uses: actions/download-artifact@v4
        with:
          name: DeveloperSecondBrain-windows
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: DeveloperSecondBrain-macos
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
            release/*.dmg
          overwrite_files: true
          generate_release_notes: true
